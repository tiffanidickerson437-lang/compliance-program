# ISO/IEC 42001:2023 mapped over the Living Control Set — explicit STRM entries.
#
# Directionality and entry shape are defined ONCE in mappings/strm-schema.yaml:
# the owned control is the Reference document, the framework requirement is the
# Focal document. This file was migrated from the retired keyword-heuristic
# draft format (per-candidate relationship plus a 0-1 numeric score field).
# Migration rules:
#   - relationship: intersects-with carried over unchanged (symmetric, so the
#     directionality fix does not alter it).
#   - relationship_strength = round(prior 0-1 score * 10), clamped to 1-10.
#   - Heuristic candidates whose control IDs are not in the Living Control Set
#     (02-controls/control-library.yaml) were dropped with the heuristic —
#     machine keyword guesses against retired catalog IDs, never human-approved.
# Status remains DRAFT: a human reviews and approves via pull request; the merge
# is the authorization.
strm_mapping:
  framework_id: iso42001
  framework_name: "ISO/IEC 42001:2023 (AI Management System)"
  status: DRAFT_PENDING_HUMAN_APPROVAL
  schema: mappings/strm-schema.yaml
  requirements_source: frameworks/iso-42001.requirements.yaml
  method: >
    Explicit STRM authored per mappings/strm-schema.yaml. Migrated from the
    retired keyword-heuristic draft; strengths derive mechanically from the
    prior 0-1 scores (round(score * 10)) and are pending human calibration
    before approval.
  entries:
    - mapping:
        master_control_id: "AAT-01"
        external_framework: "ISO/IEC 42001:2023"
        external_requirement_id: "A.2.2"
        strm_parameters:
