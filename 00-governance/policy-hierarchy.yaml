# =============================================================================
# policy-hierarchy.yaml  -  the document control register for the program.
#
# Every policy, standard, and procedure has one owning function, one approver,
# a review cadence, a version, and a status. The frameworks list shows which
# regimes each document supports. `linked_controls` ties a document to the
# controls it governs in 02-controls/control-library.yaml.
#
# Tiers move from intent to execution:
#   tier-0  governance documents ratified by the governing body
#   tier-1  policies (what must be true), approved by an executive function
#   tier-2  standards (the measurable bar), owned by the function that enforces it
#   tier-3  procedures and runbooks (how it is done day to day)
#
# Cadence and ownership are seeded by `config.example.yaml`: a non-empty `listings`
# block makes the SOX ITGC standard mandatory; `ai-products: true` makes the
# AI policy set mandatory; `data-types` decides which privacy policies apply.
# Status is `scaffold` until Phase 1 validates owners and approvers.
# =============================================================================

metadata:
  pillar: 00-governance
  owner_function: governance
  review_cadence: annual
  status: scaffold

tiers:
  - id: tier-0
    name: Governance documents
    description: Charter and statements that set authority and appetite. Ratified by the governing body.
    default_review: annual
  - id: tier-1
    name: Policies
    description: Statements of what must be true. Approved by an executive function.
    default_review: annual
  - id: tier-2
    name: Standards
    description: The measurable bar that makes a policy testable. Owned by the enforcing function.
    default_review: annual
  - id: tier-3
    name: Procedures and runbooks
    description: How the standard is met day to day. Owned by the operating function.
    default_review: semiannual

status_legend:
  scaffold: Placeholder shipped with the program; not yet ratified.
  draft: Under authoring or review.
  active: Approved and in force.
  retired: Superseded; retained for history.

