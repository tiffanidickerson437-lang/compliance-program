# Policy Tests
#
# Runs the policy-as-code in policy/ and fails the build on any violation or any
# regression. Rego is the canonical form, so the job runs the native OPA tests.
# It also runs the fixture-driven harness, which exercises every allow and deny
# fixture through the evaluator, and it runs the Python fallback engine directly
# so the policy is proven to execute even on a host without OPA.

name: Policy Tests

on:
  push:
    paths:
      - "policy/**"
      - "tools/policy_eval.py"
      - ".claude/hooks/**"
      - "tests/test_claude_workspace.py"
  pull_request:
    paths:
      - "policy/**"
      - "tools/policy_eval.py"
      - ".claude/hooks/**"
      - "tests/test_claude_workspace.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The .claude/ workspace guardrail hooks are policy at the harness layer:
  # the same PR-only / no-direct-push / evidence-is-never-AI-authored rules,
  # enforced before a tool call runs. This job proves the hooks block and
  # allow correctly (jq is preinstalled on ubuntu-latest).
  guardrail-hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout program repo
        uses: actions/checkout@v7

      - name: Guardrail hook tests (block push-to-main, block AI-authored evidence)
        run: python3 tests/test_claude_workspace.py

      - name: settings.json is valid JSON
        run: python3 -m json.tool .claude/settings.json > /dev/null

  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout program repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Rego policies are valid
        run: opa check policy/

      - name: Native Rego unit tests (fixtures are harness inputs, not Rego data)
        run: opa test policy/ --ignore '*.json' -v

      - name: Fixture-driven gate (evaluator uses OPA when present)
        run: python3 policy/policy_test.py

      - name: Prove the Python fallback engine executes the policy
        run: |
          python3 tools/policy_eval.py --policy agent_access \
            --input policy/fixtures/agent_access/deny_standing_entitlement.json \
            --engine python --explain || true
          python3 tools/policy_eval.py --policy change_control \
            --input policy/fixtures/change_control/allow_reviewed_merge.json \
            --engine python
