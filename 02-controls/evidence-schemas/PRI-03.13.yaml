schema:
  control: PRI-03.13
  title: Verifiable parental consent register
  source_system: Consent Service + data-access broker
  collection: computed
  ai_generated: false
  oscal_form: assessment-results observation, aggregate plus exception list
  description: >
    A computed register of minor accounts and their consent state, joined to any
    third-party disclosure events. The register proves verifiable parental consent
    was on record before a minor's data was processed, and that withdrawals were
    honored within the service-level window. Accounts processing without valid
    consent surface as exceptions, not as silent gaps.
  field_contract: >
    Every field below names its source system and how it is computed. The register
    is exported from the consent store, never authored by a model, which is why
    ai_generated is a required constant false and a true value is rejected.
  fields:
    - name: control
      type: string
      const: PRI-03.13
      required: true
      source: pipeline constant
      computation: Set to the control ID this record evidences.
      description: Control identifier this record evidences.
    - name: period
      type: string
      format: YYYY-Qn or YYYY-MM
      required: true
      source: reporting calendar
      computation: The reporting period the register covers.
      description: Reporting period.
    - name: source
      type: string
      required: true
      source: system inventory
      computation: Names the consent system of record and the broker that enforces it.
      description: Consent system of record and the broker that enforces it.
    - name: minor_accounts_in_scope
      type: integer
      required: true
      source: account directory filtered by age signal
      computation: Count of accounts identified as belonging to a minor in the period.
      description: Count of accounts identified as belonging to a minor in the period.
    - name: with_verified_parental_consent
      type: integer
      required: true
      source: Consent Service (consent records keyed to child account)
      computation: Count of in-scope accounts with a recorded verifiable parental consent before processing.
      description: Count of in-scope accounts with a recorded verifiable parental consent.
    - name: verification_method
      type: string
      required: true
      source: Consent Service (verification_method)
      computation: The method used to verify the consenting parent or guardian, recorded per account.
      description: Method used to verify the consenting parent or guardian.
    - name: third_party_disclosures_without_consent
      type: integer
      required: true
      source: data-access broker (disclosure events joined to consent state)
      computation: Count of disclosures to a third party while a separate active consent was absent; target is zero.
      description: Count of disclosures to a third party without active consent.
    - name: withdrawals_honored_within_sla
      type: string
      format: honored/total
      required: true
      source: Consent Service withdrawals joined to broker deny events
      computation: Ratio of consent withdrawals that propagated to a processing and disclosure block within the SLA.
      description: Ratio of consent withdrawals propagated within the SLA window.
    - name: ai_generated
      type: boolean
      const: false
      required: true
      source: pipeline metadata
      computation: Set false because the register is exported from the consent store, not authored by a model.
      description: Must be false. Evidence must be traceable to the consent store, so model-authored records are rejected by schema.
  example:
    control: PRI-03.13
    period: 2026-Q2
    source: Consent Service + data-access broker
    minor_accounts_in_scope: 18420
    with_verified_parental_consent: 18420
    verification_method: verifiable parental consent
    third_party_disclosures_without_consent: 0
    withdrawals_honored_within_sla: "211/211"
    ai_generated: false
  audit_ready_when:
    - Register is exported from the consent store, not reconstructed.
    - with_verified_parental_consent equals minor_accounts_in_scope, or the delta is an itemized exception.
    - third_party_disclosures_without_consent is zero.
    - Withdrawal handling reconciles to broker deny events.
  rejected_when:
    - ai_generated is true.
    - third_party_disclosures_without_consent is greater than zero without a logged exception and remediation.
    - Processing is observed for an account whose consent_state is withdrawn or absent.
