metadata:
  title: Framework Crosswalk
  version: "1.0.0"
  source_of_truth: control-library.yaml
  oscal_profiles_dir: profiles/
  description: >
    One owned control, every framework it satisfies. The control is defined once
    in control-library.yaml. This file is the human-queryable mapping; the OSCAL
    profiles under profiles/ are the machine-readable selection per framework, so
    a framework view is a profile resolution, not a second copy of the control.
    Query by control to answer "what does AAT-01 satisfy"; query by framework to
    answer "what do I need for SOC 2" in seconds.

# Framework registry: display name and the resolvable OSCAL profile per framework.
frameworks:
  soc2:
    name: SOC 2 (TSC 2017)
    profile: profiles/soc2.profile.oscal.json
  iso27001:
    name: ISO 27001:2022
    profile: profiles/iso27001.profile.oscal.json
  iso42001:
    name: ISO/IEC 42001:2023
    profile: profiles/iso42001.profile.oscal.json
  nist_ai_rmf:
    name: NIST AI RMF 1.0
    profile: profiles/nist-ai-rmf.profile.oscal.json
  nist_csf:
    name: NIST CSF 2.0
    profile: profiles/nist-csf.profile.oscal.json
  coppa:
    name: COPPA (amended 2025)
    profile: profiles/coppa.profile.oscal.json
  ccpa_cpra:
    name: CCPA / CPRA (2026)
    profile: profiles/ccpa-cpra.profile.oscal.json
  eu_ai_act:
    name: EU AI Act (2024)
    profile: profiles/eu-ai-act.profile.oscal.json
  gdpr:
    name: GDPR
    profile: profiles/gdpr.profile.oscal.json
  hipaa:
    name: HIPAA Security Rule
    profile: profiles/hipaa.profile.oscal.json
  nist80053:
    name: NIST 800-53 r5
    profile: profiles/nist80053.profile.oscal.json
  pci:
    name: PCI DSS v4
    profile: profiles/pci.profile.oscal.json

