    - framework: ISO/IEC 27002:2022
      refs: ["5.12", "5.13", "8.10", "8.12"]
    - framework: NIST CSF 2.0
      refs: ["ID.AM-07", "PR.DS-01"]
    - framework: EU GDPR
      refs: ["Art. 5(1)(c)", "Art. 5(1)(e)", "Art. 32"]
