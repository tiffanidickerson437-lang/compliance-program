      refs: ["CC9.2", "CC2.3"]
    - framework: ISO/IEC 27002:2022
      refs: ["5.19", "5.20", "5.22"]
    - framework: NIST CSF 2.0
      refs: ["GV.SC-04", "GV.SC-06", "GV.SC-07"]
    - framework: NIST AI RMF 1.0
