      refs: ["CC3.4", "CC8.1"]
    - framework: ISO/IEC 27002:2022
      refs: ["8.19", "8.32"]
    - framework: NIST CSF 2.0
      refs: ["ID.RA-07"]
    - framework: SOX ITGC   # framework-mapped, home lab
      refs: ["Change management, segregation of dev and approver"]
