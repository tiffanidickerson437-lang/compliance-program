      refs: ["CC6.2", "CC6.3"]
    - framework: ISO/IEC 27002:2022
      refs: ["5.15", "5.18", "8.2"]
    - framework: SOX ITGC   # framework-mapped, home lab
      refs: ["Access to programs and data"]
      basis: framework-mapped, home lab
  CHG-02:
