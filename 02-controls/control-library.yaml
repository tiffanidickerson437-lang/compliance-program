  - id: CHG-02
    scf_id: CHG-02
    requirement_level: MCR
    absorbed_owned_control:
      legacy_id: CHG-01
      source: legacy owned control library v1.0.0 (file deleted in this change)
      note: >
        Same-subject owned control absorbed into this curated definition. Framework
        mappings the curated control lacked are merged below at family granularity;
        where both defined the same framework, the curated audit-depth references stand
        (see PR for the rule).
    scf_domain: CHG
    scf_domain_name: Change Management
    class: SCF
    csf_function: Protect
    family: change management
    title: Configuration change control
    owner: Engineering (Security owns the policy)
    automation: automated
    review: per change; policy and exceptions quarterly
    doc: controls/CHG-02.md
    why: >
      Change control is a pillar of IT general controls. In a source-control-native
      program, the pull request is the gate and the evidence is a byproduct of
      shipping, so the control is enforced by configuration rather than by
      reminder.
    statement: >
      Technical configuration change reaches production only through a
      peer-reviewed pull request linked to a tracked work item, with required
      checks passing. Direct pushes to protected branches are blocked, the
      reviewer is independent of the author, and emergency changes follow a
      documented after-the-fact review.
    implementation_guidance: >
      Make branch protection the technical enforcement of the policy rather than a
      written rule people are asked to follow. The protected production branch
      requires a pull request, at least one approving review from a reviewer who
      is not the author, a linked work item, and a passing set of required status
      checks. Direct pushes are blocked at the platform, so the bypass path does
      not exist rather than being discouraged.

      The evidence is the merge record pulled from the source-control API: the
      linked ticket, the independent reviewer, the passing checks, and the merge
      timestamp. This is collected, not reconstructed, and it is the same record
      that satisfies the change-management assertion of segregation between the
      function that develops a change and the function that approves its release.
      Enforce
      that independence through code-owner rules so the approver cannot be the
      author.

      Provide an explicit emergency-change path for the rare case where a fix must
      ship before normal review. The emergency change is logged at the time, and
      it carries a documented after-the-fact review within the reconciliation
      window. Any change that reaches production outside the reviewed path is an
      exception that surfaces in the evidence with a closure path, so the
      exception rate is visible rather than hidden.
    parameters:
      - id: chg-02_prm_min_approvals
        label: Minimum independent approvals
        value: 1 (reviewer not equal to author)
        guidance: Required approving reviews on a protected-branch pull request, none from the author.
      - id: chg-02_prm_protected_branches
        label: Protected branches
        value: production release branches
        guidance: Branches where direct pushes are blocked and the reviewed-PR gate is enforced.
      - id: chg-02_prm_required_checks
        label: Required status checks
        value: build, automated tests, and security checks must pass
        guidance: Checks that must pass before merge is permitted; failing checks block the merge.
      - id: chg-02_prm_emergency_window
        label: Emergency-change review window
        value: 3 business days
        guidance: Maximum time from an emergency change to its documented after-the-fact review.
    enhancements:
      - id: CHG-02(1)
        title: Branch protection blocks direct pushes
        statement: The protected production branch rejects direct pushes so change can reach production only through a reviewed pull request.
      - id: CHG-02(2)
        title: Independent review for segregation of duties
        statement: At least one approving reviewer is not the author, enforced through code-owner rules, satisfying the change-segregation assertion.
      - id: CHG-02(3)
        title: Work-item linkage per change
        statement: Each merged change links to a tracked work item so the reason for the change is recorded.
      - id: CHG-02(4)
        title: Emergency-change after-the-fact review
        statement: Emergency changes are logged at the time and reviewed within the reconciliation window.
    assessment_objectives:
      - id: chg-02_obj_path
        statement: Determine that production changes reached production only through a reviewed, ticket-linked pull request with passing checks.
      - id: chg-02_obj_block
        statement: Determine that direct pushes to protected branches were blocked.
      - id: chg-02_obj_independence
        statement: Determine that the approving reviewer was independent of the author.
      - id: chg-02_obj_emergency
        statement: Determine that each emergency change was reconciled by an after-the-fact review within the window.
    assessment_methods:
      examine:
        - The branch-protection configuration, the code-owner rules, and the required-checks configuration for the protected branch.
        - The emergency-change log and the after-the-fact reviews for the period.
      interview:
        - Security on the change policy and the emergency-change path.
        - Engineering on merge discipline and how independence is enforced.
        - IT on locking the CI/CD identity and check configuration against bypass.
      test:
        - Attempt a direct push to the protected branch and confirm it is blocked.
        - Sample merges and confirm a linked work item, an independent reviewer, and passing checks for each.
        - Reconcile each emergency change to a documented after-the-fact review within the window.
    evidence_schema:
      summary: >
        Source-control merge record: linked work item, independent reviewer,
        passing checks, merge timestamp, direct pushes blocked, and exceptions
        without review.
      record: evidence-schemas/CHG-02.yaml
      collection: computed
      ai_generated: false
    ci_mapping:
      ci_check: >
        A scheduled job queries the merge API for the protected production branch
        and computes: merges to production, merges with a linked ticket, merges
        with an independent reviewer, direct pushes blocked, and exceptions
        without review.
      drift_issue: >
        Any merge without an independent reviewer or a linked ticket, or any
        exception without a closure path, opens an Issue tagged CHG-02 naming
        Engineering as owner with the change-management pillar flagged.
      workflow: .github/workflows/control-drift-monitor.yml
    framework_mappings:
      - framework: SOC 2 (TSC 2017)
        references: ["CC3.4", "CC8.1"]
      - framework: ISO 27001:2022
        references: ["8.19", "8.32"]
      - framework: NIST CSF 2.0
        references: ["ID.RA-07"]
      - framework: NIST 800-53 r5
        references: ["CM-3", "CM-4", "CM-5"]
        relationship: subset-of
        note: family-granularity mapping absorbed from owned control CHG-01
      - framework: NIST CSF 2.0
        references: ["PR.PS-01"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control CHG-01
      - framework: PCI DSS v4
        references: ["6.5.1", "6.5.2"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control CHG-01
    test_procedure: >
      Query the merge API for the production branch for the period; confirm linked
      ticket and independent review; investigate direct pushes and exceptions
      without review.
    example_evidence:
      control: CHG-02
      period: 2026-05
      source: GitHub (branch protection + merge API)
      merges_to_prod: 138
      with_linked_ticket: 138
      with_independent_review: 137
      direct_pushes_blocked: 6
      exceptions_without_review: 1
      ai_generated: false
    props:
      - name: scf-id
        value: CHG-02
      - name: scf-domain
        value: CHG
      - name: nist-csf-function
        value: Protect
      - name: automation
        value: automated
    stakeholder_asks:
      - audience: Engineering
        raci: R
        ask: Merge only via a reviewed PR linked to a ticket. The PR is the evidence.
      - audience: Security
        raci: A
        ask: Own the branch-protection policy and the emergency-change path; reconcile the one un-reviewed exception this period.
      - audience: IT
        raci: C
        ask: Keep the CI/CD identity and check configuration locked so the gate cannot be bypassed.
      - audience: Auditor
        raci: I
        ask: Receive the computed merge log; no screenshots of individual PRs.

  - id: MON-01
    scf_id: MON-01
    requirement_level: MCR
    absorbed_owned_control:
      legacy_id: MON-01
      source: legacy owned control library v1.0.0 (file deleted in this change)
      note: >
        Same-subject owned control absorbed into this curated definition. Framework
        mappings the curated control lacked are merged below at family granularity;
        where both defined the same framework, the curated audit-depth references stand
        (see PR for the rule).
    scf_domain: MON
    scf_domain_name: Continuous Monitoring
    class: SCF
    csf_function: Govern
    family: monitoring
    title: Continuous monitoring and event logging
    owner: Security (SOC)
    automation: automated
    review: continuous; coverage and retention quarterly
    doc: controls/MON-01.md
    why: >
      Continuous monitoring turns a point-in-time audit into a standing program.
      It is the operations pillar of IT general controls and the engine of the
      drift-opens-an-Issue mechanism that makes due diligence visible.
    statement: >
      Enterprise monitoring computes control health continuously. Security events
      ship to a central append-only store with retention and integrity protection.
      Logs establish what, when, where, source, outcome, and identity, and defined
      event types alert a monitored queue with an acknowledgement SLA.
    implementation_guidance: >
      Forward every in-scope source to a central store, and protect that store
      with write-once or object-lock integrity so records cannot be silently
      altered after the fact. The coverage target is the source inventory itself:
      a source that is in the inventory and not forwarding is a gap that surfaces,
      not a number quietly left out of the denominator. Each record establishes
      what happened, when, where, from which source, with what outcome, and under
      which identity, so an investigator can reconstruct a sequence without
      guessing.

      Drive control-health checks off these logs rather than off a separate
      console. A failed check opens a tracked Issue, and that Issue, timestamped
      and retained, is the evidence of due diligence: it shows the program noticed
      and acted. Route defined event types to a monitored queue with an
      acknowledgement SLA tuned by severity, and treat a missed acknowledgement as
      an exception rather than a number to round away.

      Set a retention floor that meets or exceeds the longest obligation in scope,
      and verify integrity on a cadence so an altered or missing record is itself
      an alert. This control is the operations leg of IT general controls, and it
      is the substrate the other controls compute against: AAT-01 broker decisions,
      IAC-17 revocations, CHG-02 merges, and IRO-01 incident timelines all land in
      this store.
    parameters:
      - id: mon-01_prm_retention_floor
        label: Retention floor
        value: 365 days; longer where an obligation in scope requires it
        guidance: Minimum retention for the central store; the longest in-scope obligation sets the actual floor.
      - id: mon-01_prm_ack_sla_high
        label: Alert acknowledgement SLA, high severity
        value: 30 minutes
        guidance: Maximum time to acknowledge a high-severity alert in the monitored queue.
      - id: mon-01_prm_coverage_target
        label: Source coverage target
        value: 100 percent of the source inventory
        guidance: Every in-scope source forwards; a non-forwarding in-scope source is an exception.
      - id: mon-01_prm_integrity_cadence
        label: Integrity-check cadence
        value: daily
        guidance: Frequency of write-once or object-lock integrity verification on the central store.
    enhancements:
      - id: MON-01(1)
        title: Append-only integrity protection
        statement: The central store uses write-once or object-lock so records cannot be silently altered, verified on the integrity cadence.
      - id: MON-01(2)
        title: Full source coverage against inventory
        statement: Coverage is measured against the source inventory, and a non-forwarding in-scope source is an exception.
      - id: MON-01(3)
        title: Alerting with acknowledgement SLA
        statement: Defined event types route to a monitored queue with a severity-tuned acknowledgement SLA.
      - id: MON-01(4)
        title: Drift-opens-an-Issue control-health computation
        statement: A failed control-health check opens a tracked Issue that serves as the evidence of due diligence.
    assessment_objectives:
      - id: mon-01_obj_coverage
        statement: Determine that 100 percent of in-scope sources forward to the central store.
      - id: mon-01_obj_integrity
        statement: Determine that integrity protection prevents silent alteration and that integrity checks pass.
      - id: mon-01_obj_retention
        statement: Determine that retention meets or exceeds the floor for the period.
      - id: mon-01_obj_ack
        statement: Determine that defined alerts are acknowledged within the SLA.
      - id: mon-01_obj_drift
        statement: Determine that failed control-health checks opened tracked Issues.
    assessment_methods:
      examine:
        - The source inventory against the forwarding configuration, the retention setting, and the object-lock configuration.
        - The alert ruleset and the history of drift Issues for the period.
      interview:
        - The SOC on the alert ruleset and the retention standard.
        - IT on source forwarding and integrity controls.
        - Engineering on emission of the agreed security-event schema.
      test:
        - Compare forwarding to the source inventory and identify any gap.
        - Attempt to alter a stored record and confirm the object-lock prevents it.
        - Inject a test alert and confirm acknowledgement within the SLA.
        - Force a control-health failure and confirm a tracked Issue opens.
    evidence_schema:
      summary: >
        SIEM coverage report: forwarding sources against inventory, retention,
        integrity checks, alert acknowledgement times, and drift Issues opened.
      record: evidence-schemas/MON-01.yaml
      collection: computed
      ai_generated: false
    ci_mapping:
      ci_check: >
        A scheduled job computes: ratio of in-scope sources forwarding, retention
        days applied, integrity checks failed, ratio of alerts acknowledged within
        SLA, and drift Issues opened in the period.
      drift_issue: >
        Coverage below inventory, any failed integrity check, or acknowledgements
        outside SLA open an Issue tagged MON-01 naming Security as owner with the
        operations-monitoring pillar flagged.
      workflow: .github/workflows/control-drift-monitor.yml
    framework_mappings:
      - framework: SOC 2 (TSC 2017)
        references: ["CC7.2"]
      - framework: ISO 27001:2022
        references: ["8.15", "8.16"]
      - framework: NIST CSF 2.0
        references: ["DE.CM-01", "DE.CM-03", "DE.CM-09"]
      - framework: NIST 800-53 r5
        references: ["AU-2", "AU-6", "SI-4"]
        relationship: subset-of
        note: family-granularity mapping absorbed from owned control MON-01
      - framework: NIST CSF 2.0
        references: ["DE.CM", "DE.AE"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control MON-01
      - framework: HIPAA Security Rule
        references: ["164.312(b)", "164.308(a)(1)(ii)(D)"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control MON-01
      - framework: PCI DSS v4
        references: ["10.2", "10.4"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control MON-01
    test_procedure: >
      Verify the source coverage report matches inventory; confirm retention and
      integrity checks; sample alert acknowledgement within SLA.
    example_evidence:
      control: MON-01
      period: 2026-Q2
      source: SIEM + immutable object-lock store
      sources_forwarding: "64/64"
      retention_days: 400
      integrity_checks_failed: 0
      alerts_ack_within_sla: "309/311"
      drift_issues_opened: 14
      ai_generated: false
    props:
      - name: scf-id
        value: MON-01
      - name: scf-domain
        value: MON
      - name: nist-csf-function
        value: Govern
      - name: automation
        value: automated
    stakeholder_asks:
      - audience: Security
        raci: A
        ask: Own the alert ruleset and the retention standard; account for the two alerts that missed acknowledgement SLA.
      - audience: IT
        raci: R
        ask: Keep every in-scope source forwarding with integrity controls enabled. The coverage report is the evidence.
      - audience: Engineering
        raci: C
        ask: Emit the agreed security event schema from your services so the SOC can parse and alert on it.
      - audience: Auditor
        raci: I
        ask: Receive the computed coverage-and-integrity report; sample against the log store, not a console.

  - id: TPM-01
    scf_id: TPM-01
    requirement_level: MCR
    absorbed_owned_control:
      legacy_id: TPM-01
      source: legacy owned control library v1.0.0 (file deleted in this change)
      note: >
        Same-subject owned control absorbed into this curated definition. Framework
        mappings the curated control lacked are merged below at family granularity;
        where both defined the same framework, the curated audit-depth references stand
        (see PR for the rule).
    scf_domain: TPM
    scf_domain_name: Third-Party Management
    class: SCF
    csf_function: Govern
    family: third-party risk
    title: Third-party management
    owner: GRC (Legal/Privacy on terms)
    automation: partial, workflow-tracked
    review: at onboarding and renewal; tiered reassessment for high risk
    doc: controls/TPM-01.md
    why: >
      Sensitive data flows to subprocessors and model providers. Diligence depth
      must match what a party can touch on the location graph, and trust evidence
      a vendor already produced should be reused rather than re-collected.
    statement: >
      Third parties with system or personal-data access are tiered by what they
      can touch, assessed before onboarding, and bound by security, breach-notice,
      and processing terms. High-risk parties reassess on cadence, and vendor
      trust evidence is reused rather than re-questionnaired.
    implementation_guidance: >
      Tier by data sensitivity and access first, business dependency and breach
      impact second. The restricted, highest tier is anchored to parties that
      touch precise location or children's data on the location graph, and to
      foundation-model providers whose terms govern whether customer data trains a
      model. Tier is not a function of contract size: a high-spend tool that never
      receives sensitive data sits in a lower tier, and a small subprocessor that
      ingests real-time location sits at the top.

      Accept a current SOC 2 Type II or ISO 27001 certificate in lieu of a custom
      questionnaire, recording the scope it covers and any exceptions, so the
      program reuses the assurance the vendor already produced instead of
      restarting diligence. Bind every in-scope party with a data processing
      agreement that carries a breach-notice window, processing limits, and
      subprocessor terms. Map Tier 1 subprocessors so concentration risk, where
      many critical paths share one provider, is visible.

      AI may draft the gap analysis from the vendor's report and propose a tier,
      which makes the analyst faster, but a human GRC owner validates scope,
      exceptions, and tier before anything is recorded. The recorded evidence is
      computed and human-validated, never model-authored. Reassess high-risk
      parties on cadence and on material change, and track overdue reassessments
      to closure rather than letting them age silently.
    parameters:
      - id: tpm-01_prm_tiers
        label: Tier scale
        value: Tier 1 (restricted) through Tier 4 (minimal)
        guidance: Tier set by data sensitivity and access first, dependency and breach impact second.
      - id: tpm-01_prm_reassess_t1
        label: Reassessment cadence, Tier 1
        value: annual and on material change
        guidance: High-risk parties reassess at least annually and whenever scope or posture changes materially.
      - id: tpm-01_prm_breach_window
        label: Contractual breach-notice window
        value: 72 hours or tighter
        guidance: Maximum notice window required of an in-scope party in the data processing agreement.
      - id: tpm-01_prm_assurance_artifacts
        label: Accepted assurance artifacts
        value: current SOC 2 Type II or ISO 27001, scope recorded
        guidance: Artifacts accepted in lieu of a custom questionnaire, with scope and exceptions logged.
    enhancements:
      - id: TPM-01(1)
        title: Touch-based tiering
        statement: Tier is anchored to what a party can touch, with the restricted tier reserved for precise location, children's data, and model-training terms.
      - id: TPM-01(2)
        title: Assurance reuse
        statement: A current SOC 2 Type II or ISO 27001 is accepted in lieu of a custom questionnaire, with scope and exceptions recorded.
      - id: TPM-01(3)
        title: AI-drafted gap analysis with human validation
        statement: AI may draft the gap analysis and propose a tier, but a human GRC owner validates before anything is recorded.
      - id: TPM-01(4)
        title: Subprocessor and concentration mapping
        statement: Tier 1 subprocessors are mapped so concentration risk across shared providers is visible.
    assessment_objectives:
      - id: tpm-01_obj_inventory
        statement: Determine that the vendor inventory reconciles to the tiering model.
      - id: tpm-01_obj_highrisk
        statement: Determine that high-risk parties hold current assurance evidence and an executed data processing agreement.
      - id: tpm-01_obj_cadence
        statement: Determine that reassessments occurred on cadence and overdue items are tracked to closure.
      - id: tpm-01_obj_validation
        statement: Determine that AI-proposed tiers and gap analyses were validated by a human GRC owner before being recorded.
    assessment_methods:
      examine:
        - The tiering model, the vendor register, the executed data processing agreements, and the assurance artifacts with their expiries.
      interview:
        - GRC on the tiering bar and the assessment sign-off.
        - Legal/Privacy on the data processing, breach-notice, and processing-limit clauses.
        - Engineering on the data and access each party actually needs.
      test:
        - Reconcile the vendor inventory to the register and the tiering model.
        - Sample high-risk parties and confirm current assurance evidence and an executed data processing agreement.
        - Trace an AI-proposed tier to the human validation record.
        - Check overdue reassessments to a closure path.
    evidence_schema:
      summary: >
        Third-party register: tier, assessment date and outcome, executed contract
        clauses, assurance-evidence expiry, and overdue reassessments.
      record: evidence-schemas/TPM-01.yaml
      collection: computed
      ai_generated: false
    ci_mapping:
      ci_check: >
        A scheduled job joins the vendor-risk tool to the contract system and
        computes: vendors in scope, ratio of high-risk parties with current
        assurance, ratio with an executed data processing agreement, count with a
        current SOC 2, and overdue reassessments.
      drift_issue: >
        Any high-risk party without current assurance, or any overdue
        reassessment without an exception, opens an Issue tagged TPM-01 naming GRC
        as owner with the framework impact (SOC 2, NIST CSF, CCPA/CPRA).
      workflow: .github/workflows/control-drift-monitor.yml
    framework_mappings:
      - framework: SOC 2 (TSC 2017)
        references: ["CC9.2", "CC2.3"]
      - framework: ISO 27001:2022
        references: ["5.19", "5.20", "5.22"]
      - framework: NIST CSF 2.0
        references: ["GV.SC-04", "GV.SC-06", "GV.SC-07"]
      - framework: NIST AI RMF 1.0
        references: ["MANAGE 3.0"]
      - framework: CCPA / CPRA (2026)
        references: ["§7052(a)"]
      - framework: GDPR
        references: ["Art. 28"]
      - framework: NIST 800-53 r5
        references: ["SR-3", "SR-6", "SA-9"]
        relationship: subset-of
        note: family-granularity mapping absorbed from owned control TPM-01
      - framework: NIST CSF 2.0
        references: ["GV.SC"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control TPM-01
      - framework: PCI DSS v4
        references: ["12.8"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control TPM-01
    test_procedure: >
      Reconcile the vendor inventory to the tiering model; confirm high-risk
      parties have current assessments and DPAs; track overdue reassessments to
      closure.
    example_evidence:
      control: TPM-01
      period: 2026-Q2
      source: Vendor Risk tool + CLM
      vendors_in_scope: 96
      high_risk_current: "18/18"
      with_executed_dpa: "96/96"
      with_current_soc2: 71
      overdue_reassessment: 2
      ai_generated: false
    props:
      - name: scf-id
        value: TPM-01
      - name: scf-domain
        value: TPM
      - name: nist-csf-function
        value: Govern
      - name: automation
        value: partial
    stakeholder_asks:
      - audience: GRC
        raci: A
        ask: Own the tiering model and the assessment bar; sign off that high-risk parties have current assurance evidence.
      - audience: Legal/Privacy
        raci: R
        ask: Land the DPA, breach-notice window, and processing-limit clauses in every in-scope contract. The executed clauses are the evidence.
      - audience: Vendor
        raci: R
        ask: Provide a current SOC 2 or equivalent and complete intake before access; refresh on renewal.
      - audience: Engineering
        raci: C
        ask: Confirm the data and access each party actually needs so the tier reflects real exposure.
      - audience: Auditor
        raci: I
        ask: Receive the computed register; reconcile the two overdue reassessments.

  - id: IRO-01
    scf_id: IRO-01
    requirement_level: MCR
    absorbed_owned_control:
      legacy_id: IRO-01
      source: legacy owned control library v1.0.0 (file deleted in this change)
      note: >
        Same-subject owned control absorbed into this curated definition. Framework
        mappings the curated control lacked are merged below at family granularity;
        where both defined the same framework, the curated audit-depth references stand
        (see PR for the rule).
    scf_domain: IRO
    scf_domain_name: Incident Response
    class: SCF
    csf_function: Govern
    family: incident response
    title: Incident response operations
    owner: Security (Legal/Privacy on notification)
    automation: partial
    review: per incident; tabletop and plan review annually
    doc: controls/IRO-01.md
    why: >
      Incident response is where regulatory clocks become real: breach
      notification within statutory timelines, and AI-specific incidents such as
      an autonomous agent acting out of scope on the location graph.
    statement: >
      Incidents are detected, triaged, contained, and recorded against a governed
      plan, including AI scope breaches. Legal/Privacy owns notification within
      statutory timelines, and every incident receives a post-incident review.
    implementation_guidance: >
      Generate the incident record from the paging and tracking tooling rather
      than reconstructing a narrative after the fact. The record carries the
      detection time, the severity, the containment and resolution timestamps, the
      notification decision and its basis, and a link to the post-incident review.
      Because the record is sourced from tooling, the timeline is defensible: it
      shows when the program detected, decided, and acted, not when someone
      remembered to write it down.

      Run a severity scale that sets containment expectations by level, and route
      severity-1 incidents to a named escalation including the board where the
      obligation requires it. Legal/Privacy owns the notification decision: whether
      a statutory or contractual threshold is met, and if so, that the regulator
      and affected parties are notified within the clock that applies. The decision
      and its basis are logged, because the decision not to notify is as much a
      record as the decision to notify.

      Keep an AI-incident runbook for the case where an autonomous agent acts out
      of scope on the location graph, with a kill-switch path that ties back to
      AAT-01. Every incident, regardless of severity, gets a post-incident review
      that feeds control design, and the program tabletops at least annually,
      including an AI-scope scenario, so the plan is exercised before it is needed.
    parameters:
      - id: iro-01_prm_severity_scale
        label: Severity scale
        value: Sev1 through Sev4
        guidance: Severity levels that set containment expectations and escalation paths.
      - id: iro-01_prm_reg_clock
        label: Regulatory notification clock
        value: 72 hours where GDPR applies; the applicable statutory window otherwise
        guidance: The notification window for a threshold-meeting incident, set by the regime in scope.
      - id: iro-01_prm_containment_sla
        label: Containment SLA, severity-1
        value: defined per the severity scale
        guidance: Target interval from triage to containment for the highest severity.
      - id: iro-01_prm_tabletop
        label: Tabletop cadence
        value: at least annual, including an AI-scope scenario
        guidance: Frequency of exercising the plan, including an autonomous-agent scenario.
    enhancements:
      - id: IRO-01(1)
        title: AI-scope incident handling and kill-switch
        statement: An AI-incident runbook covers an agent acting out of scope on the location graph, with a kill-switch path tied to AAT-01.
      - id: IRO-01(2)
        title: Notification decision log with statutory clock
        statement: Legal/Privacy logs the notification decision and its basis, and meets the statutory clock when a threshold is met.
      - id: IRO-01(3)
        title: Mandatory post-incident review
        statement: Every incident receives a post-incident review that feeds back into control design.
      - id: IRO-01(4)
        title: Annual tabletop including an AI scenario
        statement: The plan is exercised at least annually, including an autonomous-agent scope scenario.
    assessment_objectives:
      - id: iro-01_obj_timeline
        statement: Determine that incident records carry complete timeline fields sourced from tooling.
      - id: iro-01_obj_review
        statement: Determine that every incident received a post-incident review.
      - id: iro-01_obj_notify
        statement: Determine that threshold-meeting incidents carry a decision log and met the statutory timeline.
      - id: iro-01_obj_ai
        statement: Determine that AI-scope incidents reference the kill-switch action taken.
    assessment_methods:
      examine:
        - The incident response plan, the severity scale, the breach-decision log, and the post-incident reviews for the period.
        - The AI-incident runbook and the most recent tabletop record.
      interview:
        - Security on the plan, the severity scale, the containment SLA, and the tabletop.
        - Legal/Privacy on notification decisions and the statutory clocks.
        - Engineering on containment and recovery on their services.
      test:
        - Sample incidents and confirm complete timeline fields sourced from the tracker.
        - Verify a post-incident review exists for each sampled incident.
        - For a threshold-meeting incident, confirm the decision basis and the statutory timeline were met.
        - Tabletop an AI-scope agent incident and confirm the kill-switch path executes.
    evidence_schema:
      summary: >
        IR platform record: detection, severity, containment, resolution,
        notification decision, statutory timeline, and post-review link.
      record: evidence-schemas/IRO-01.yaml
      collection: computed
      ai_generated: false
    ci_mapping:
      ci_check: >
        A scheduled job reads the incident tracker and the breach-decision log and
        computes: incidents, severity-1 count, AI-scope incidents, median
        detect-to-triage minutes, incidents meeting a notification threshold,
        regulator notified within the clock, and post-incident reviews completed.
      drift_issue: >
        Any incident missing a post-incident review, or any threshold-meeting
        incident missing a decision basis, opens an Issue tagged IRO-01 naming
        Security and Legal/Privacy as owners.
      workflow: .github/workflows/control-drift-monitor.yml
    framework_mappings:
      - framework: SOC 2 (TSC 2017)
        references: ["CC7.3", "CC7.4"]
      - framework: ISO 27001:2022
        references: ["5.24"]
      - framework: NIST CSF 2.0
        references: ["DE.AE", "RS.MI"]
      - framework: NIST AI RMF 1.0
        references: ["GOVERN 6.2", "MANAGE 2.4"]
      - framework: CCPA / CPRA (2026)
        references: ["Civil Code §1798.82", "§7123(c)(17)"]
      - framework: GDPR
        references: ["Art. 33", "Art. 34"]
      - framework: NIST 800-53 r5
        references: ["IR-4", "IR-5", "IR-8"]
        relationship: subset-of
        note: family-granularity mapping absorbed from owned control IRO-01
      - framework: NIST CSF 2.0
        references: ["RS.MA", "DE.AE"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control IRO-01
      - framework: HIPAA Security Rule
        references: ["164.308(a)(6)"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control IRO-01
      - framework: PCI DSS v4
        references: ["12.10"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control IRO-01
    test_procedure: >
      Sample incidents for complete timeline fields; verify post-incident reviews
      completed; for notification-threshold incidents, confirm the decision log and
      statutory timelines.
    example_evidence:
      control: IRO-01
      period: 2026-Q2
      source: paging + incident tracker + breach-decision log
      incidents: 9
      sev1: 1
      ai_scope_incidents: 1
      median_detect_to_triage_min: 11
      notify_threshold_met: 1
      regulator_notified_within_72h: 1
      post_reviews_completed: 9
      ai_generated: false
    props:
      - name: scf-id
        value: IRO-01
      - name: scf-domain
        value: IRO
      - name: nist-csf-function
        value: Govern
      - name: automation
        value: partial
    stakeholder_asks:
      - audience: Security
        raci: A
        ask: Own the IR plan, the severity scale, and the containment SLA; run the post-incident review and the annual tabletop.
      - audience: Engineering
        raci: R
        ask: Execute containment and recovery on your services and feed timestamps to the incident record. That record is the evidence.
      - audience: Legal/Privacy
        raci: A
        ask: Own the breach-notification decision and timeline; determine when statutory thresholds are met and document the basis.
      - audience: C-Suite / Board
        raci: I
        ask: Receive Sev1 notification and the post-incident summary. Major-incident escalation is a board-visible obligation.
      - audience: Customer
        raci: I
        ask: Receive breach notification when the threshold is met, within the statutory window.
      - audience: Auditor
        raci: I
        ask: Receive the computed incident records with timelines and review links; no reconstructed narratives.

  - id: CRY-01
    scf_id: CRY-01
    requirement_level: MCR
    absorbed_owned_control:
      legacy_id: CRY-01
      source: legacy owned control library v1.0.0 (file deleted in this change)
      note: >
        Same-subject owned control absorbed into this curated definition. Framework
        mappings the curated control lacked are merged below at family granularity;
        where both defined the same framework, the curated audit-depth references stand
        (see PR for the rule).
    scf_domain: CRY
    scf_domain_name: Cryptographic Protections
    class: SCF
    csf_function: Protect
    family: cryptography
    title: Use of cryptographic controls
    owner: Security (Engineering implements)
    automation: partial
    review: continuous posture; algorithm and key-policy review annually
    doc: controls/CRY-01.md
    why: >
      A service holding real-time precise location and minor data must make that
      data unreadable to anyone without authorization, at rest and in transit. The
      public trust material already claims TLS in transit and AES at rest; this
      control is what turns that claim into a tested, evidenced state rather than a
      marketing line. It also underwrites every other control: the consent gate,
      the access review, and the agent broker all assume the underlying data is
      encrypted and the keys are governed.
    statement: >
      Sensitive and regulated data is protected with cryptographic controls that
      meet a defined standard, in transit and at rest. Keys are generated, stored,
      rotated, and revoked under a documented key-management process, separated
      from the data they protect. Weak or deprecated algorithms and protocols are
      not used, and exceptions are tracked and time-bound.
    implementation_guidance: >
      Define the cryptographic standard once, as policy-as-code where it can be
      enforced: the approved algorithms, minimum key lengths, and protocol
      versions, plus the explicit deny-list of deprecated ones. Encrypt precise
      location and minor data at rest with authenticated encryption and in transit
      with current TLS, and treat any endpoint negotiating a deprecated protocol as
      drift, not an accepted state. Keep keys in a managed key store or HSM, never
      in source, configuration, or application logs, and separate the duty to
      manage keys from the duty to access the data those keys protect. Rotate keys
      on a defined cadence and on any suspected compromise, and make revocation
      fast enough that a compromised key is a bounded event. Where the AI layer or
      an analytics pipeline processes location data, prefer minimization and
      tokenization so the cleartext is exposed to the fewest systems possible. The
      evidence is the computed configuration state — cipher in use per data store,
      protocol per endpoint, key age and rotation status — not a policy assertion
      that encryption is "enabled."
    parameters:
      - id: cry-01_prm_at_rest_standard
        label: Data-at-rest standard
        value: authenticated encryption, AES-256 or stronger
        guidance: Applies to precise location and minor data stores; tune up per data class, never down.
      - id: cry-01_prm_in_transit_standard
        label: Data-in-transit standard
        value: TLS 1.2 minimum, TLS 1.3 preferred; deprecated protocols denied
        guidance: Any endpoint negotiating below the floor is drift.
      - id: cry-01_prm_key_rotation_interval
        label: Key rotation interval
        value: 365 days maximum, or immediately on suspected compromise
        guidance: Maximum age before a key must rotate; shorter for the highest-sensitivity stores.
      - id: cry-01_prm_key_data_duty_separation
        label: Key/data duty separation
        value: required
        guidance: The function that manages keys is not the function that reads the protected data.
    enhancements:
      - id: CRY-01(1)
        title: Approved-algorithm enforcement
        statement: An enforced standard names approved algorithms, key lengths, and protocol versions and denies deprecated ones; violations surface as drift.
      - id: CRY-01(2)
        title: Managed key custody and separation of duties
        statement: Keys live in a managed key store or HSM, never in source or logs, and key management is separated from data access.
      - id: CRY-01(3)
        title: Scheduled and event-driven rotation
        statement: Keys rotate on cadence and immediately on suspected compromise, with revocation bounded by a defined interval.
      - id: CRY-01(4)
        title: Minimization of cleartext exposure
        statement: Location and minor data are tokenized or minimized so the fewest systems, including the AI layer, ever hold cleartext.
    assessment_objectives:
      - id: cry-01_obj_encrypted
        statement: Determine that precise location and minor data are encrypted at rest and in transit to the defined standard.
      - id: cry-01_obj_no_deprecated
        statement: Determine that no in-scope endpoint or store uses a deprecated algorithm or protocol outside a tracked, time-bound exception.
      - id: cry-01_obj_key_custody
        statement: Determine that keys are held in a managed store, separated from data-access duties, and absent from source and logs.
      - id: cry-01_obj_rotation
        statement: Determine that keys rotate within the defined interval and revoke within the defined window on compromise.
    assessment_methods:
      examine:
        - The cryptographic standard and the approved/deny algorithm and protocol lists.
        - The key-management process, the key inventory, and the rotation and revocation records.
        - The encryption configuration for the precise-location and minor-data stores.
      interview:
        - Security on the standard, the deny-list, and how violations surface as drift.
        - Engineering on where keys live, how rotation runs, and how cleartext exposure is minimized in the data and AI pipelines.
      test:
        - Sample data stores and confirm authenticated encryption at the defined strength.
        - Probe a sample of endpoints and confirm none negotiate a deprecated protocol.
        - Pull the key inventory and confirm rotation within interval and no keys present in source or logs.
    evidence_schema:
      summary: >
        Per data store and endpoint: cipher or protocol in use, key reference, key
        age, last rotation, and any deprecated-protocol negotiation observed.
      record: evidence-schemas/CRY-01.yaml
      collection: computed
      ai_generated: false
    ci_mapping:
      ci_check: >
        A daily job inventories encryption configuration across in-scope stores and
        endpoints and computes: stores below the at-rest standard (target zero),
        endpoints negotiating a deprecated protocol (target zero), and keys past
        the rotation interval.
      drift_issue: >
        Any store below standard, any deprecated-protocol endpoint, or any overdue
        key opens an Issue tagged CRY-01 naming Security as owner, with the
        framework impact (SOC 2, ISO 27001, GDPR).
      workflow: .github/workflows/control-drift-monitor.yml
    framework_mappings:
      - framework: SOC 2 (TSC 2017)
        references: ["CC6.1", "CC6.7"]
      - framework: ISO 27001:2022
        references: ["8.24"]
      - framework: NIST CSF 2.0
        references: ["PR.DS-01", "PR.DS-02"]
      - framework: GDPR
        references: ["Art. 32"]
      - framework: NIST 800-53 r5
        references: ["SC-8", "SC-13", "SC-28"]
        relationship: subset-of
        note: family-granularity mapping absorbed from owned control CRY-01
      - framework: NIST CSF 2.0
        references: ["PR.DS-01", "PR.DS-02"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control CRY-01
      - framework: HIPAA Security Rule
        references: ["164.312(a)(2)(iv)", "164.312(e)(2)(ii)"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control CRY-01
      - framework: PCI DSS v4
        references: ["3.5", "4.2"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control CRY-01
    test_procedure: >
      Sample in-scope stores and endpoints; confirm authenticated encryption at the
      at-rest standard and no deprecated protocol negotiated; pull the key
      inventory and confirm rotation within interval and no keys in source or logs.
    props:
      - name: scf-id
        value: CRY-01
      - name: scf-domain
        value: CRY
      - name: nist-csf-function
        value: Protect
      - name: automation
        value: partial
    stakeholder_asks:
      - audience: Security
        raci: A
        ask: Own the cryptographic standard and key-management process; certify no in-scope store or endpoint runs below the floor.
      - audience: Engineering
        raci: R
        ask: Implement encryption to standard, keep keys out of source and logs, and emit the configuration state as evidence.
      - audience: Legal/Privacy
        raci: C
        ask: Confirm the standard meets the security-of-processing bar for precise location and minor data.
      - audience: Auditor
        raci: I
        ask: Receive the computed configuration and key inventory; sample against the store, not a screenshot.

  - id: VPM-01
    scf_id: VPM-01
    requirement_level: MCR
    absorbed_owned_control:
      legacy_id: VPM-01
      source: legacy owned control library v1.0.0 (file deleted in this change)
      note: >
        Same-subject owned control absorbed into this curated definition. Framework
        mappings the curated control lacked are merged below at family granularity;
        where both defined the same framework, the curated audit-depth references stand
        (see PR for the rule).
    scf_domain: VPM
    scf_domain_name: Vulnerability & Patch Management
    class: SCF
    csf_function: Identify
    family: vulnerability management
    title: Vulnerability and patch management
    owner: Security (Engineering remediates)
    automation: automated
    review: continuous scanning; SLA review quarterly
    doc: controls/VPM-01.md
    why: >
      Every auditor expects a vulnerability and patch program, and its absence is
      the gap a security questionnaire probes first. For a service on a
      multi-cluster cloud estate shipping continuously, unpatched dependencies and
      exposed services are the most common path to the precise-location data this
      program exists to protect. This control makes finding and fixing known
      weaknesses a measured, time-bound loop rather than a periodic scramble.
    statement: >
      Technical vulnerabilities across code, dependencies, images, and
      infrastructure are discovered continuously, triaged by severity and exposure,
      and remediated within defined service levels. Internet-facing and
      sensitive-data systems carry the tightest timelines. Unremediated
      vulnerabilities past SLA are tracked as exceptions with a named owner and a
      closure plan.
    implementation_guidance: >
      Discover vulnerabilities from more than one vantage point: dependency and
      container scanning in the pipeline, infrastructure and external-surface
      scanning in the running estate, and the intake of vendor and CISA advisories.
      Normalize findings into one queue with a severity and an exposure dimension,
      because a critical on an internet-facing system holding location data is not
      the same risk as the same critical on an isolated internal tool. Set
      remediation SLAs by that combination and enforce them as the aging clock on
      the queue, not as a guideline. Patch through the same governed change path as
      any other production change (CHG-02), so the fix carries its own evidence.
      When a fix cannot ship inside the SLA, it becomes a tracked exception with a
      compensating control, a named owning function, and an expiry, never a silent
      overdue. Feed the highest-exposure findings into the risk register so the
      program is steered by real weakness, not only by audit cadence.
    parameters:
      - id: vpm-01_prm_critical_sla
        label: Critical remediation SLA (internet-facing / sensitive data)
        value: 15 days
        guidance: Maximum from confirmed finding to remediation for the highest-exposure systems.
      - id: vpm-01_prm_high_sla
        label: High remediation SLA
        value: 30 days
        guidance: Tune by exposure; sensitive-data systems trend toward the critical timeline.
      - id: vpm-01_prm_scan_cadence
        label: Scan cadence
        value: continuous in pipeline; external surface at least weekly
        guidance: Discovery is continuous, not a quarterly event.
      - id: vpm-01_prm_exception_ceiling
        label: Exception ceiling
        value: time-bound, compensating control required
        guidance: No vulnerability sits overdue without a tracked exception and an expiry.
    enhancements:
      - id: VPM-01(1)
        title: Multi-source continuous discovery
        statement: Pipeline dependency/image scanning, running-estate and external-surface scanning, and advisory intake feed one normalized queue.
      - id: VPM-01(2)
        title: Exposure-weighted SLAs
        statement: Remediation timelines are set by severity and exposure together; internet-facing and sensitive-data systems carry the tightest clocks.
      - id: VPM-01(3)
        title: Patch through the change gate
        statement: Remediations ship via the governed pull-request change path (CHG-02), so the fix produces its own evidence.
      - id: VPM-01(4)
        title: Tracked, expiring exceptions
        statement: A miss past SLA becomes an exception with a compensating control, a named owner, and an expiry.
    assessment_objectives:
      - id: vpm-01_obj_discovery
        statement: Determine that vulnerabilities are discovered continuously across code, dependencies, images, and infrastructure.
      - id: vpm-01_obj_triage
        statement: Determine that findings are triaged by severity and exposure and assigned the corresponding SLA.
      - id: vpm-01_obj_remediation
        statement: Determine that remediations are delivered within SLA, or carried as a tracked, time-bound exception with a compensating control.
      - id: vpm-01_obj_exposure
        statement: Determine that internet-facing and sensitive-data systems receive the tightest remediation timelines.
    assessment_methods:
      examine:
        - The vulnerability-management policy, the SLA matrix, and the scanner and advisory-source inventory.
        - The current finding queue with severity, exposure, age, and disposition.
        - The exception register with compensating controls and expiries.
      interview:
        - Security on triage, the SLA model, and how exposure is weighted.
        - Engineering on how patches ship through the change path and how exceptions are tracked.
      test:
        - Sample findings and confirm triage, SLA assignment, and on-time remediation or a valid exception.
        - Confirm an internet-facing sample carries the critical SLA and was met or exception-tracked.
        - Confirm no overdue finding exists without a tracked, unexpired exception.
    evidence_schema:
      summary: >
        Per finding: source, severity, exposure class, affected asset, age, SLA,
        disposition, and exception status.
      record: evidence-schemas/VPM-01.yaml
      collection: computed
      ai_generated: false
    ci_mapping:
      ci_check: >
        A daily job reads the normalized finding queue and computes: criticals past
        SLA on internet-facing or sensitive-data systems (target zero), highs past
        SLA, and overdue findings without a tracked exception.
      drift_issue: >
        Any nonzero count opens an Issue tagged VPM-01 naming Security as owner with
        the affected assets and the framework impact (SOC 2, ISO 27001, NIST CSF).
      workflow: .github/workflows/control-drift-monitor.yml
    framework_mappings:
      - framework: SOC 2 (TSC 2017)
        references: ["CC7.1"]
      - framework: ISO 27001:2022
        references: ["8.8"]
      - framework: NIST CSF 2.0
        references: ["ID.RA-01", "PR.PS-02"]
      - framework: NIST 800-53 r5
        references: ["RA-5", "SI-2"]
        relationship: subset-of
        note: family-granularity mapping absorbed from owned control VPM-01
      - framework: NIST CSF 2.0
        references: ["ID.RA-01", "PR.PS-02"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control VPM-01
      - framework: PCI DSS v4
        references: ["6.3.3", "11.3"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control VPM-01
    test_procedure: >
      Sample findings for triage, SLA assignment, and on-time remediation or a valid
      exception; confirm internet-facing and sensitive-data systems carry the
      tightest timelines; confirm no overdue finding lacks a tracked exception.
    props:
      - name: scf-id
        value: VPM-01
      - name: scf-domain
        value: VPM
      - name: nist-csf-function
        value: Identify
      - name: automation
        value: automated
    stakeholder_asks:
      - audience: Security
        raci: A
        ask: Own discovery, triage, and the SLA model; certify no overdue critical on an exposed or sensitive-data system.
      - audience: Engineering
        raci: R
        ask: Remediate within SLA through the change gate; the merge is the fix evidence.
      - audience: GRC
        raci: C
        ask: Carry exposure-weighted findings into the risk register so leverage steers remediation.
      - audience: Auditor
        raci: I
        ask: Receive the computed finding queue and exception register; sample against the scanner, not a report.

  - id: DCH-01
    scf_id: DCH-01
    requirement_level: MCR
    absorbed_owned_control:
      legacy_id: DCH-01
      source: legacy owned control library v1.0.0 (file deleted in this change)
      note: >
        Same-subject owned control absorbed into this curated definition. Framework
        mappings the curated control lacked are merged below at family granularity;
        where both defined the same framework, the curated audit-depth references stand
        (see PR for the rule).
    scf_domain: DCH
    scf_domain_name: Data Classification & Handling
    class: SCF
    csf_function: Identify
    family: data protection
    title: Data classification and protection
    owner: Legal/Privacy (Security and Engineering enforce)
    automation: partial
    review: continuous handling checks; classification scheme review annually
    doc: controls/DCH-01.md
    why: >
      Every other data control inherits its scope from this one. Precise location
      and minor data are the crown jewels; if they are not classified, inventoried,
      and bound to handling and retention rules, then encryption, access review,
      consent, and the agent broker are all guarding a boundary no one has drawn.
      This control draws the boundary: it names the highest-sensitivity classes,
      holds them to minimization and retention limits, and makes deletion a
      recorded event.
    statement: >
      Data is classified by sensitivity, and precise location and minor data are
      designated the highest-sensitivity class. Handling, retention, and disposal
      rules attach to the classification and are enforced. Data is minimized to
      what the declared purpose requires and deleted or restricted when the lawful
      basis ends. Cleartext flows of the highest-sensitivity classes are
      inventoried so every other control knows its scope.
    implementation_guidance: >
      Define a classification scheme with a small number of levels and an
      unambiguous top class for precise location and minor data. Attach handling
      rules to the class rather than to the system, so a new store inherits the
      rule the moment its data is classified. Maintain an inventory of where the
      highest-sensitivity classes live and flow, because that inventory is the
      scoping input for CRY-01 encryption, IAC-17 access review, AAT-01 agent
      brokering, and PRI-03.13 consent. Enforce minimization at collection and at
      use: collect only what the declared purpose needs, and where the AI layer or
      analytics consume location data, prefer aggregation or tokenization over raw
      cleartext. Set retention limits per class and make deletion a recorded,
      verifiable event tied to consent withdrawal, account closure, or the end of
      the lawful basis, not a background process no one can attest to. Treat the
      appearance of a highest-sensitivity class in an unapproved store or an
      unclassified flow as drift that opens an Issue, because an unknown copy of
      location data is the failure this control exists to catch.
    parameters:
      - id: dch-01_prm_top_classes
        label: Highest-sensitivity classes
        value: precise location, minor data
        guidance: Inherit the tightest handling, retention, and access rules.
      - id: dch-01_prm_minor_retention
        label: Minor-data retention limit
        value: shortest interval that serves the declared purpose
        guidance: Held tighter than adult data; deletion fires on consent withdrawal or account closure.
      - id: dch-01_prm_deletion_evidence
        label: Deletion evidence
        value: recorded and verifiable per request
        guidance: Disposal is an evidenced event, not an assumed background job.
      - id: dch-01_prm_unclassified_flow
        label: Unclassified sensitive flow
        value: drift, opens an Issue
        guidance: A highest-sensitivity class in an unapproved or unclassified store surfaces, never sits silent.
    enhancements:
      - id: DCH-01(1)
        title: Top-class designation for location and minor data
        statement: Precise location and minor data are designated the highest-sensitivity class and inherit the tightest rules.
      - id: DCH-01(2)
        title: Sensitive-data flow inventory
        statement: The locations and flows of the highest-sensitivity classes are inventoried and serve as the scope input to CRY-01, IAC-17, AAT-01, and PRI-03.13.
      - id: DCH-01(3)
        title: Minimization at collection and use
        statement: Collection is limited to the declared purpose; the AI and analytics layers prefer aggregation or tokenization over raw cleartext.
      - id: DCH-01(4)
        title: Recorded deletion on end of basis
        statement: Deletion or restriction is a recorded, verifiable event on consent withdrawal, account closure, or end of lawful basis.
    assessment_objectives:
      - id: dch-01_obj_scheme
        statement: Determine that a classification scheme exists and precise location and minor data are the highest-sensitivity class.
      - id: dch-01_obj_rules
        statement: Determine that handling, retention, and disposal rules attach to classification and are enforced.
      - id: dch-01_obj_inventory
        statement: Determine that an inventory of the highest-sensitivity data and its flows exists and scopes the dependent controls.
      - id: dch-01_obj_minimization
        statement: Determine that minimization is applied at collection and use, and deletion on end-of-basis is recorded and verifiable.
    assessment_methods:
      examine:
        - The classification scheme, the handling and retention rules per class, and the sensitive-data flow inventory.
        - The minimization rules applied to the AI and analytics pipelines.
        - The deletion and restriction records tied to consent withdrawal and account closure.
      interview:
        - Legal/Privacy on the scheme, retention limits, and lawful-basis-driven deletion.
        - Engineering on how classification drives handling and how deletion is recorded and verified.
      test:
        - Sample stores and confirm the highest-sensitivity classes are classified, inventoried, and held to the handling rule.
        - Trigger a deletion case (consent withdrawal or closure) and confirm the data is deleted or restricted with a record.
        - Search for a highest-sensitivity class in an unapproved store and confirm it surfaces as drift.
    evidence_schema:
      summary: >
        Per highest-sensitivity data store and flow: classification, retention
        rule, approved/unapproved status, and deletion records for end-of-basis
        cases.
      record: evidence-schemas/DCH-01.yaml
      collection: computed
      ai_generated: false
    ci_mapping:
      ci_check: >
        A daily job reconciles the sensitive-data inventory and computes:
        highest-sensitivity classes in unapproved or unclassified stores (target
        zero), records past the retention limit, and end-of-basis deletions
        completed versus due.
      drift_issue: >
        Any unapproved sensitive store, any over-retained record, or any missed
        end-of-basis deletion opens an Issue tagged DCH-01 naming Legal/Privacy as
        owner with the framework impact (SOC 2, ISO 27001, GDPR, CCPA/CPRA).
      workflow: .github/workflows/control-drift-monitor.yml
    framework_mappings:
      - framework: SOC 2 (TSC 2017)
        references: ["C1.1", "C1.2"]
      - framework: ISO 27001:2022
        references: ["5.12", "5.13", "8.10", "8.12"]
      - framework: NIST CSF 2.0
        references: ["ID.AM-07", "PR.DS-01"]
      - framework: GDPR
        references: ["Art. 5(1)(c)", "Art. 5(1)(e)", "Art. 32"]
      - framework: CCPA / CPRA (2026)
        references: ["Civil Code §1798.100(c)"]
      - framework: NIST 800-53 r5
        references: ["AC-4", "SC-7", "SI-4"]
        relationship: subset-of
        note: family-granularity mapping absorbed from owned control DCH-01
      - framework: NIST CSF 2.0
        references: ["PR.DS"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control DCH-01
    test_procedure: >
      Sample highest-sensitivity stores for classification, handling, and retention;
      trigger an end-of-basis deletion and confirm a verifiable record; search for a
      top-class in an unapproved store and confirm it surfaces as drift.
    props:
      - name: scf-id
        value: DCH-01
      - name: scf-domain
        value: DCH
      - name: nist-csf-function
        value: Identify
      - name: automation
        value: partial
    stakeholder_asks:
      - audience: Legal/Privacy
        raci: A
        ask: Own the classification scheme and retention limits; define lawful-basis-driven deletion for minor and location data.
      - audience: Engineering
        raci: R
        ask: Enforce handling by classification, maintain the sensitive-data inventory, and record deletions as evidence.
      - audience: Security
        raci: C
        ask: Confirm the highest-sensitivity inventory scopes encryption, access review, and the agent broker.
      - audience: Auditor
        raci: I
        ask: Receive the computed inventory and deletion records; sample against the store, not an attestation.

  - id: SAT-02
    scf_id: SAT-02
    requirement_level: MCR
    absorbed_owned_control:
      legacy_id: SAT-01
      source: legacy owned control library v1.0.0 (file deleted in this change)
      note: >
        Same-subject owned control absorbed into this curated definition. Framework
        mappings the curated control lacked are merged below at family granularity;
        where both defined the same framework, the curated audit-depth references stand
        (see PR for the rule).
    scf_domain: SAT
    scf_domain_name: Security Awareness & Training
    class: SCF
    csf_function: Protect
    family: awareness and training
    title: Security awareness and role-based training
    owner: Security (People/HR delivers)
    automation: partial
    review: annual baseline; role-based on assignment and on material change
    doc: controls/SAT-02.md
    why: >
      This is the control that legitimately sits at SOC 2 CC1.4 — commitment to
      competence — which is why AAT-01 was moved off it. People are the control
      surface that no broker covers: the engineer who mishandles a location export,
      the support agent who is socially engineered into disclosing a minor's data.
      A workforce trained to the specific risks of precise location, minor data,
      and an agentic AI layer is a control, and its absence is the soft spot a
      determined attacker targets first.
    statement: >
      Personnel complete security and privacy awareness training on hire and on a
      recurring cadence, and role-based training is delivered to functions with
      elevated access or specific obligations. Training covers the risks specific
      to this service: precise-location and minor-data handling, social-engineering
      resistance, and the governance of the agentic AI layer. Completion is
      tracked, and non-completion for in-scope roles is an exception with a named
      owner.
    implementation_guidance: >
      Deliver a baseline to everyone and a sharper, role-based module to the
      functions that carry elevated risk: engineers who can touch the location
      graph, support staff who field account requests, and the functions
      accountable for the AI layer and for consent. Tie the role-based content to
      the actual controls — what verifiable parental consent requires (PRI-03.13),
      what an agent is and is not allowed to do on a minor's account (AAT-01), how
      to handle a sensitive-data export (DCH-01) — so training reinforces the
      program rather than running parallel to it. Make completion a computed state
      drawn from the learning system of record keyed to the HRIS, so the in-scope
      population is current as people join, move, and leave, and a role change
      re-triggers the module its new access requires. Treat non-completion for an
      in-scope role as a tracked exception with an owner and an expiry, not a
      number that quietly drifts. Refresh content on material change — a new
      regulation, a new AI capability, a recurring incident theme — so the training
      tracks the risk rather than the calendar.
    parameters:
      - id: sat-02_prm_baseline_cadence
        label: Baseline cadence
        value: on hire, then annually
        guidance: All personnel; completion tracked against the HRIS population.
      - id: sat-02_prm_role_based_trigger
        label: Role-based trigger
        value: on assignment to an elevated-access or obligation-bearing role, and on material change
        guidance: Engineers on the location graph, support, AI-layer and consent owners.
      - id: sat-02_prm_completion_sla
        label: Completion SLA (new hires)
        value: 30 days from start
        guidance: Maximum interval before baseline completion for a new joiner.
      - id: sat-02_prm_non_completion
        label: Non-completion handling
        value: tracked exception, named owner, expiry
        guidance: In-scope non-completion surfaces, never sits silent.
    enhancements:
      - id: SAT-02(1)
        title: Role-based modules tied to controls
        statement: Elevated-access and obligation-bearing roles receive training mapped to PRI-03.13, AAT-01, and DCH-01, reinforcing the program's own controls.
      - id: SAT-02(2)
        title: HRIS-keyed completion state
        statement: Completion is computed from the learning system of record keyed to the HRIS, so the in-scope population stays current through joins, moves, and leaves.
      - id: SAT-02(3)
        title: Re-trigger on role change
        statement: A move into an elevated role re-triggers the module that role requires before access is exercised.
      - id: SAT-02(4)
        title: Content refresh on material change
        statement: New regulation, new AI capability, or a recurring incident theme refreshes content out of the annual cycle.
    assessment_objectives:
      - id: sat-02_obj_baseline
        statement: Determine that all personnel complete baseline awareness training on hire and on the recurring cadence.
      - id: sat-02_obj_role_based
        statement: Determine that role-based training reaches the elevated-access and obligation-bearing functions, tied to the controls they operate.
      - id: sat-02_obj_computed
        statement: Determine that completion is computed from a system of record keyed to the current workforce population.
      - id: sat-02_obj_exception
        statement: Determine that non-completion for in-scope roles is carried as a tracked, time-bound exception.
    assessment_methods:
      examine:
        - The training curriculum, the role-to-module mapping, and the completion records keyed to the HRIS.
        - The content-refresh history against regulatory and incident triggers.
        - The exception register for in-scope non-completion.
      interview:
        - Security on the curriculum and how role-based content maps to the controls.
        - People/HR on how completion is tracked against joins, moves, and leaves.
      test:
        - Sample new hires and confirm baseline completion within SLA.
        - Sample an elevated-access role and confirm the role-based module was assigned and completed on assignment.
        - Confirm no in-scope role sits non-complete without a tracked, unexpired exception.
    evidence_schema:
      summary: >
        Per person in scope: role, assigned modules, completion status and date, and
        exception status for any non-completion.
      record: evidence-schemas/SAT-02.yaml
      collection: computed
      ai_generated: false
    ci_mapping:
      ci_check: >
        A daily job joins the learning system of record to the HRIS and computes:
        in-scope personnel without current baseline completion, elevated-access
        roles without their role-based module, and new hires past the completion
        SLA.
      drift_issue: >
        Any nonzero count opens an Issue tagged SAT-02 naming Security as owner with
        the framework impact (SOC 2, ISO 27001, NIST CSF).
      workflow: .github/workflows/control-drift-monitor.yml
    framework_mappings:
      - framework: SOC 2 (TSC 2017)
        references: ["CC1.4", "CC2.2"]
      - framework: ISO 27001:2022
        references: ["6.3"]
      - framework: NIST CSF 2.0
        references: ["PR.AT-01", "PR.AT-02"]
      - framework: NIST 800-53 r5
        references: ["AT-2", "AT-3"]
        relationship: subset-of
        note: family-granularity mapping absorbed from owned control SAT-01
      - framework: NIST CSF 2.0
        references: ["PR.AT"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control SAT-01
      - framework: HIPAA Security Rule
        references: ["164.308(a)(5)"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control SAT-01
      - framework: PCI DSS v4
        references: ["12.6"]
        relationship: intersects-with
        note: family-granularity mapping absorbed from owned control SAT-01
    test_procedure: >
      Sample new hires for baseline completion within SLA; sample an elevated-access
      role for the assigned role-based module on assignment; confirm no in-scope
      role sits non-complete without a tracked, unexpired exception.
    props:
      - name: scf-id
        value: SAT-02
      - name: scf-domain
        value: SAT
      - name: nist-csf-function
        value: Protect
      - name: automation
        value: partial
    stakeholder_asks:
      - audience: Security
        raci: A
        ask: Own the curriculum and the role-to-control mapping; certify the in-scope population is current.
      - audience: People/HR
        raci: R
        ask: Deliver training and keep completion keyed to the live workforce through joins, moves, and leaves.
      - audience: Engineering
        raci: C
        ask: Confirm role-based content matches what each elevated role actually does on the location graph.
      - audience: Auditor
        raci: I
        ask: Receive the computed completion state; sample against the learning record, not a sign-in sheet.

